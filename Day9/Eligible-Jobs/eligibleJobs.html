<template>

    <lightning-card
        title="Eligible Jobs"
        icon-name="standard:job_profile">

        <div class="slds-p-around_medium">

            <!-- Application Success Message -->
            <template if:true={successMessage}>
                <div class="slds-notify slds-notify_alert slds-alert_success slds-m-bottom_medium">
                {successMessage}
                </div>
            </template>

            <!-- Application Error Message -->
            <template if:true={applicationError}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium">
                {applicationError}
                </div>
            </template>


            <!-- Loading State -->
            <template if:true={isLoading}>

                <div class="slds-align_absolute-center slds-p-around_large">

                    <lightning-spinner
                        alternative-text="Loading eligible jobs"
                        size="medium">
                    </lightning-spinner>

                    <span class="slds-m-left_small">
                        Loading eligible jobs...
                    </span>

                </div>

            </template>


            <!-- Error State -->
            <template if:true={error}>

                <div class="slds-text-color_error slds-p-around_medium">

                    Unable to load eligible jobs.
                    Please try again later.

                </div>

            </template>


            <!-- Success State -->
            <template if:false={isLoading}>

                <template if:false={error}>

                    <!-- Jobs Available -->
                    <template if:true={jobs.length}>

                        <template
                            for:each={jobs}
                            for:item="job">

                            <article
                                key={job.id}
                                class="slds-card slds-card_boundary slds-m-bottom_medium">

                                <div class="slds-card__header slds-grid">

                                    <div class="slds-media slds-media_center slds-has-flexi-truncate">

                                        <div class="slds-media__body">

                                            <h2 class="slds-card__header-title">
                                                {job.jobTitle}
                                            </h2>

                                        </div>

                                    </div>

                                </div>


                                <div class="slds-card__body slds-card__body_inner">

                                    <p class="slds-m-bottom_small">
                                        <strong>Company:</strong>
                                        {job.companyName}
                                    </p>

                                    <p class="slds-m-bottom_small">
                                        <strong>Minimum CGPA:</strong>
                                        {job.minimumCGPA}
                                    </p>

                                    <p class="slds-m-bottom_small">
                                        <strong>Closing Date:</strong>
                                        {job.closingDate}
                                    </p>


                                    <lightning-button
                                        label="View Details"
                                        variant="brand"
                                        data-id={job.id}
                                        onclick={handleViewDetails}>
                                    </lightning-button>

                                    <lightning-button
                                        label="Apply"
                                        variant="success"
                                        class="slds-m-left_small"
                                        data-id={job.id}
                                        onclick={handleApply}
                                        disabled={isApplying}>
                                    </lightning-button>

                                </div>

                            </article>

                        </template>

                    </template>


                    <!-- Empty State -->
                    <template if:false={jobs.length}>

                        <div class="slds-align_absolute-center slds-p-around_large">

                            <p>
                                No eligible jobs are currently available.
                            </p>

                        </div>

                    </template>


                    <!-- Selected Job Details -->
                    <template if:true={selectedJob}>

                        <div class="slds-box slds-theme_default slds-m-top_large">

                            <h2 class="slds-text-heading_medium slds-m-bottom_medium">
                                Job Details
                            </h2>

                            <p class="slds-m-bottom_small">
                                <strong>Job Title:</strong>
                                {selectedJob.jobTitle}
                            </p>

                            <p class="slds-m-bottom_small">
                                <strong>Company:</strong>
                                {selectedJob.companyName}
                            </p>

                            <p class="slds-m-bottom_small">
                                <strong>Minimum CGPA:</strong>
                                {selectedJob.minimumCGPA}
                            </p>

                            <p class="slds-m-bottom_small">
                                <strong>Closing Date:</strong>
                                {selectedJob.closingDate}
                            </p>

                        </div>

                    </template>

                </template>

            </template>

        </div>

    </lightning-card>

</template>
